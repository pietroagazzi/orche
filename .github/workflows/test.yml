name: Test

on:
    push:
        branches: [main, develop]
        paths: &code-paths
            - "orche/**"
            - "tests/**"
            - "pyproject.toml"
            - "uv.lock"
            - ".github/workflows/test.yml"
    pull_request:
        branches: [main, develop]
        paths: *code-paths

permissions:
    contents: read

concurrency:
    group: test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Pull requests only cover the oldest and newest Python on
                # Linux; the full OS/version matrix runs after merge.
                os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
                python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.15"]' || '["3.11", "3.12", "3.13", "3.14", "3.15"]') }}

        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install dependencies
              run: uv sync --extra dev

            - name: Run tests
              run: uv run pytest -v --cov=orche --cov-report=xml --cov-report=term

            - name: Upload coverage to Codecov
              if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  file: ./coverage.xml
                  fail_ci_if_error: false

    build:
        name: Build Package
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Build package
              run: uv build

            - name: Upload artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist/
